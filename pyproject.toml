[project]
name = "code-intel"
version = "0.1.0"
description = "Repository intelligence CLI for catalog search, change reports, tests, and risk."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
code-intel = "code_intel.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]
lint.select = ["E", "F", "I", "UP", "B", "D"]
lint.ignore = ["D203", "D213"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
